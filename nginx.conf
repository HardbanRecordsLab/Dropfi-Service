events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25M;

    # Rate limiting for public endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # API upstream (FastAPI)
    upstream dropify_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name dropify.app www.dropify.app;

        ssl_certificate     /etc/letsencrypt/live/dropify.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dropify.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://dropify_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Block Swagger docs and OpenAPI schema — never expose in production
        location /docs {
            return 404;
        }

        location /openapi.json {
            return 404;
        }

        # Celery Flower monitoring UI — basic auth required in production
        location /flower/ {
            auth_basic "Flower Monitoring";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://flower:5555;
            proxy_set_header Host $host;
        }

        location / {
            # Frontend is served by Vercel - this only catches non-API traffic
            return 308 https://dropify.vercel.app$request_uri;
        }
    }
}
